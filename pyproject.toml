[build-system]
requires = ["setuptools>=77"]  # 77+ reads the SPDX license string below
build-backend = "setuptools.build_meta"

[project]
name = "meetnotes"
version = "0.1.0"
description = "Turn meeting recordings into grouped to-do lists: local speech-to-text, then any LLM or coding agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []  # the CLI, the LLM step and publishing use only the standard library

[project.optional-dependencies]
# Speech-to-text. Install PyTorch for your GPU FIRST (see README): pip would pick a CPU-only build on Windows.
# librosa: transformers uses it to load the audio files the Qwen3-ASR processor is given by path
asr = ["transformers>=5.18", "soundfile", "librosa", "numpy"]

[project.scripts]
meetnotes = "meetnotes.cli:entry"

[tool.setuptools.packages.find]
include = ["meetnotes*"]

[tool.setuptools.package-data]
meetnotes = ["prompts/*.md"]
